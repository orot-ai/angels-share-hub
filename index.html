<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>엔젤스쉐어 바이브코딩 세션 · 참가자 허브</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #16161f;
      --card: #12121a;
      --card-hover: #1a1a28;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8e8ed;
      --text-dim: #8b8b9e;
      --accent: #a78bfa;
      --accent-2: #818cf8;
      --accent-3: #6366f1;
    }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .gradient-text {
      background-image: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gradient-bg {
      background-image: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
    }
    .glow::before {
      content: '';
      position: absolute;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: var(--accent);
      opacity: 0.12;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    .card-soft {
      background: rgba(167, 139, 250, 0.06);
      border: 1px solid rgba(167, 139, 250, 0.16);
      border-radius: 12px;
    }
    .prompt-block {
      background: #0d0d14;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'SF Mono', ui-monospace, 'Menlo', monospace;
      font-size: 0.85rem;
      line-height: 1.7;
      color: #cfd0e0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .btn-primary {
      background-image: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
      color: white;
      font-weight: 600;
      border-radius: 9999px;
      padding: 12px 24px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 4px 24px rgba(167, 139, 250, 0.22);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 32px rgba(167, 139, 250, 0.32); }
    .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-ghost {
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-weight: 500;
      border-radius: 9999px;
      padding: 12px 24px;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--text); }
    .btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }
    .step-pill {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-dim);
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .step-pill.active {
      border-color: transparent;
      background-image: linear-gradient(135deg, var(--accent), var(--accent-3));
      color: white;
    }
    .step-pill.done {
      border-color: rgba(167, 139, 250, 0.35);
      color: var(--accent);
    }
    .step-pill:hover { border-color: var(--accent); color: var(--text); }
    .step-pill.active:hover { border-color: transparent; color: white; }
    .progress-bar {
      background: var(--card);
      height: 4px;
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-fill {
      background-image: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
      height: 100%;
      transition: width 0.4s ease;
    }
    .copy-btn {
      background: rgba(167, 139, 250, 0.12);
      color: var(--accent);
      border: 1px solid rgba(167, 139, 250, 0.24);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .copy-btn:hover { background: rgba(167, 139, 250, 0.2); border-color: var(--accent); }
    .copy-btn.copied { background: rgba(74, 222, 128, 0.15); color: #4ade80; border-color: rgba(74, 222, 128, 0.35); }
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      transition: border-color 0.2s ease, transform 0.2s ease;
      color: var(--text);
    }
    .link-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .checklist-item {
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      font-size: 0.92rem;
      line-height: 1.6;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: white;
      padding: 10px 20px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 8px 32px rgba(167, 139, 250, 0.4);
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 50;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .scroll-steps {
      scrollbar-width: none;
    }
    .scroll-steps::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen">

<!-- 상단 네비 (progress + step pills) -->

</header>

<!-- 메인 콘텐츠 -->

<div id="toast" class="toast">복사됨</div>

// 렌더링

const state = { current: 0 };

function restoreState() {
  const saved = parseInt(localStorage.getItem('angels-share-step') || '0', 10);
  if (!Number.isNaN(saved) && saved >= 0 && saved < STEPS.length) {
    state.current = saved;
  }
}

function persistState() {
  localStorage.setItem('angels-share-step', String(state.current));
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderBlock(b, idx) {
  if (b.type === 'heading') {
    return `<h3 class="text-[1.15rem] font-semibold mt-10 mb-4">${b.text}</h3>`;
  }
  if (b.type === 'text') {
    return `<p class="leading-8 mb-4" style="color: var(--text);">${b.body}</p>`;
  }
  if (b.type === 'note') {
    return `<div class="card-soft p-4 mb-5 leading-7 text-[0.92rem]" style="color: var(--text);">💡 ${b.body}</div>`;
  }
  if (b.type === 'checklist') {
    return `<ul class="flex flex-col gap-2 mb-5">${b.items.map(item =>
      `<li class="checklist-item"><span style="color: var(--accent);">□</span><span>${item}</span></li>`
    ).join('')}</ul>`;
  }
  if (b.type === 'links') {
    return `<div class="flex flex-col gap-2 mb-5">${b.items.map(link => {
      const isTodo = link.href.startsWith('#todo');
      const isChromeInternal = link.href.startsWith('chrome://');
      const isCopyOnly = isTodo || isChromeInternal;
      const safeHref = isCopyOnly ? 'javascript:void(0)' : escapeHtml(link.href);
      const target = isCopyOnly ? '' : 'target="_blank" rel="noopener noreferrer"';
      const badgeStyle = isTodo
        ? 'background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3);'
        : 'background: rgba(167,139,250,0.15); color: var(--accent); border: 1px solid rgba(167,139,250,0.3);';
      const badge = isTodo ? 'URL 대기' : link.badge;
      const copyAttr = isChromeInternal ? ` data-copy-link="${escapeHtml(link.href)}"` : '';
      return `<a href="${safeHref}" ${target}${copyAttr} class="link-card">
        <span class="font-medium">${link.label}</span>
        <span class="text-xs px-2.5 py-1 rounded-full" style="${badgeStyle}">${badge}</span>
      </a>`;
    }).join('')}</div>`;
  }
  if (b.type === 'prompt') {
    const id = `prompt-${state.current}-${idx}`;
    return `<div class="mb-6">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold uppercase tracking-wider" style="color: var(--accent);">${b.title}</span>
        <button class="copy-btn" data-copy-target="${id}">복사</button>
      </div>
      <pre id="${id}" class="prompt-block p-4">${escapeHtml(b.code)}</pre>
    </div>`;
  }
  return '';
}

function renderStepPills() {
  const el = document.getElementById('step-pills');
  el.innerHTML = STEPS.map((s, i) => {
    const cls = i === state.current ? 'active' : (i < state.current ? 'done' : '');
    return `<button class="step-pill ${cls}" data-goto="${i}">${s.emoji} ${s.n}</button>`;
  }).join('');
  el.querySelectorAll('[data-goto]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.current = parseInt(btn.dataset.goto, 10);
      render();
    });
  });
}

function renderStepDots() {
  const el = document.getElementById('step-dots');
  el.textContent = `${state.current + 1} / ${STEPS.length}`;
}

function render() {
  const step = STEPS[state.current];
  const content = document.getElementById('step-content');
  content.innerHTML = `
    <div class="mb-8">
      <div class="flex items-center gap-3 mb-3">
        <span class="text-3xl">${step.emoji}</span>
        <span class="text-xs font-semibold uppercase tracking-wider" style="color: var(--accent);">STEP ${step.n} · ${step.time}</span>
      </div>
      <h1 class="text-[1.9rem] font-bold tracking-tight leading-tight">${step.title}</h1>
    </div>
    ${step.blocks.map((b, i) => renderBlock(b, i)).join('')}
  `;

  // chrome:// 링크 클릭 시 자동 복사
  content.querySelectorAll('[data-copy-link]').forEach(el => {
    el.addEventListener('click', async (e) => {
      e.preventDefault();
      const url = el.dataset.copyLink;
      try {
        await navigator.clipboard.writeText(url);
        showToast(`"${url}" 복사됨 — 주소창에 붙여넣기`);
      } catch (err) {
        showToast('복사 실패');
      }
    });
  });

  // 복사 버튼 바인딩
  content.querySelectorAll('[data-copy-target]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const target = document.getElementById(btn.dataset.copyTarget);
      if (!target) return;
      try {
        await navigator.clipboard.writeText(target.textContent);
        btn.classList.add('copied');
        btn.textContent = '복사됨 ✓';
        showToast('프롬프트가 복사됐어요');
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = '복사';
        }, 1600);
      } catch (e) {
        showToast('복사 실패');
      }
    });
  });

  // progress
  document.getElementById('progress-fill').style.width = `${((state.current + 1) / STEPS.length) * 100}%`;
  document.getElementById('nav-step-num').textContent = `STEP ${step.n}`;
  document.getElementById('nav-step-time').textContent = step.time;

  // prev/next
  document.getElementById('prev-btn').disabled = state.current === 0;
  document.getElementById('next-btn').disabled = state.current === STEPS.length - 1;

  renderStepPills();
  renderStepDots();
  persistState();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

document.getElementById('prev-btn').addEventListener('click', () => {
  if (state.current > 0) { state.current--; render(); }
});
document.getElementById('next-btn').addEventListener('click', () => {
  if (state.current < STEPS.length - 1) { state.current++; render(); }
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft' && state.current > 0) { state.current--; render(); }
  if (e.key === 'ArrowRight' && state.current < STEPS.length - 1) { state.current++; render(); }
});

restoreState();
render();
</script>

</body>
</html>
